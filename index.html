<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123a63"><title>Canarias Accesible · Mapa</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="styles.css"></head>
<body>
<header><div><small>CANARIAS ACCESIBLE</small><h1>Mapa de instalaciones</h1></div><button id="installBtn" hidden>Instalar</button></header>
<main>
<section class="stats" id="stats"></section>
<section class="toolbar">
<input id="search" type="search" placeholder="Buscar ID, cliente, dirección, modelo…">
<select id="tech"><option value="">Todos los técnicos</option><option>OLIVER</option><option>BERNARDO</option><option>POST VENTA</option></select>
<select id="source"><option value="">Todas</option><option value="mapped">Con ubicación</option><option value="unmapped">Pendientes de ubicar</option></select>
<button id="fit">Ver Canarias</button><button id="styleBtn">Personalizar puntos</button>
<label class="import">Importar Excel<input id="excelFile" type="file" accept=".xlsx,.xls" hidden></label>
</section>
<div id="notice" class="notice" hidden></div>
<div class="layout"><section id="map" aria-label="Mapa de instalaciones"></section><aside><div class="aside-head"><strong id="resultCount">Instalaciones</strong><button id="closeDetail" hidden>Cerrar</button></div><div id="detail" hidden></div><div id="list"></div></aside></div>
</main>
<nav><button data-view="map" class="active">Mapa</button><button data-view="pending">Sin ubicar</button><button data-view="all">Listado</button></nav>
<div id="stylePanel" class="modal" hidden><div class="modal-card"><div class="modal-head"><h2>Personalizar puntos</h2><button class="icon-btn" data-close="stylePanel">×</button></div><p class="helper">Estos estilos se guardan solo en este dispositivo.</p><div id="styleRows"></div><label>Tamaño del punto <input id="pointSize" type="range" min="4" max="12" step="1"></label><div class="actions"><button id="resetStyles">Restablecer</button><button class="primary" data-close="stylePanel">Guardar</button></div></div></div>
<div id="locationPanel" class="modal" hidden><div class="modal-card"><div class="modal-head"><h2>Asignar ubicación</h2><button class="icon-btn" data-close="locationPanel">×</button></div><p class="helper">Toca el mapa en el punto exacto o escribe las coordenadas.</p><label>Dirección conocida<input id="editAddress" type="text" placeholder="Calle, número, municipio"></label><button id="geocodeAddress" type="button">Buscar dirección automáticamente</button><div class="two"><label>Latitud<input id="editLat" inputmode="decimal" type="number" step="any"></label><label>Longitud<input id="editLng" inputmode="decimal" type="number" step="any"></label></div><p id="pickStatus" class="helper"></p><div class="actions"><button id="cancelLocation">Cancelar</button><button id="saveLocation" class="primary">Guardar ubicación</button></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="app.js"></script>
</body></html>
